# Trinity-Compatible Agent Configuration
# AEGIS VP / Chief of Staff (second brain)

name: the-brain
display_name: "VP"
description: |
  VP / Chief of Staff second brain for Hamid's personal agent company.
  Reads committed CLAUDE.md and memory/ from aegis-ceo, aegis-infra,
  aegis-threat-intel, and aegis-analyst (read-only) and synthesizes
  cross-department connections for aegis-ceo. No personal Obsidian vault;
  no live cross-agent messaging.

resources:
  cpu: "2"
  memory: "4g"

version: "0.1.0"
author: "Hamid Matiny / AEGIS"
updated: "2026-09-13"
tagline: "Cross-department second brain for aegis-ceo"

use_cases:
  - "Weekly synthesis of sibling agent CLAUDE.md + memory/ into connections for the CEO"
  - "Flag patterns that span infra, threat-intel, analyst, and CEO decisions"
  - "Honest empty reports when no cross-department signal exists yet"

capabilities:
  - knowledge_synthesis
  - connection_discovery

credentials:
  env_file:
    - ANTHROPIC_BASE_URL
    - ANTHROPIC_API_KEY
    - ANTHROPIC_MODEL
    - AEGIS_TIER

# Schedules: none enabled by default — trial synthesis first, then Hamid enables cadence.
